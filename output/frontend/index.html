<!DOCTYPE html>
<html>

<head>
    <title>Library Management System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 80%;
            margin: auto;
            margin-top: 40px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 40px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 2px 10px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        h2 {
            margin-bottom: 20px;
            color: #444;
        }

        input {
            width: 22%;
            padding: 10px;
            margin-right: 8px;
            border-radius: 5px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .add-btn { background: #28a745; color: white; }
        .delete-btn { background: #dc3545; color: white; }
        .edit-btn { background: #ffc107; color: #333; }
        .update-btn { background: #007bff; color: white; }
        .cancel-btn { background: #6c757d; color: white; margin-left: 5px; }

        .book {
            border-bottom: 1px solid #ddd;
            padding: 15px 0;
        }

        .book:last-child { border-bottom: none; }

        .book h3 { margin: 0; color: #222; }
        .book p { margin: 5px 0; color: #555; }

        .book-actions { margin-top: 8px; }
        .book-actions button { margin-right: 5px; }

        /* Edit form inside book */
        .edit-form {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
        }
        .edit-form input {
            width: 28%;
            margin-bottom: 8px;
        }

        #message {
            text-align: center;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: none;
        }
        .success { background: #d4edda; color: #155724; }
        .error   { background: #f8d7da; color: #721c24; }
    </style>
</head>

<body>
    <div class="container">
        <h1>📚 Library Management System</h1>

        <div id="message"></div>

        <!-- ADD BOOK CARD -->
        <div class="card">
            <h2>Add New Book</h2>
            <input type="text" id="title" placeholder="Book Title">
            <input type="text" id="author" placeholder="Author Name">
            <input type="number" id="price" placeholder="Price (₹)" min="1">
            <button class="add-btn" onclick="addBook()">+ Add Book</button>
        </div>

        <!-- BOOK LIST CARD -->
        <div class="card">
            <h2>All Books</h2>
            <div id="bookList"><p style="color:#999;">Loading books...</p></div>
        </div>
    </div>

    <script>
        const API = "http://localhost:9093";

        // SHOW MESSAGE
        function showMessage(msg, type) {
            const el = document.getElementById("message");
            el.textContent = msg;
            el.className = type;
            el.style.display = "block";
            setTimeout(() => { el.style.display = "none"; }, 3000);
        }

        // LOAD ALL BOOKS
        function loadBooks() {
            fetch(`${API}/books`)
            .then(res => res.json())
            .then(data => {
                const list = document.getElementById("bookList");
                if (data.length === 0) {
                    list.innerHTML = "<p style='color:#999;'>No books found. Add one above!</p>";
                    return;
                }

                let output = "";
                data.forEach(book => {
                    output += `
                        <div class="book" id="book-${book.id}">
                            <h3>${book.title}</h3>
                            <p><b>Author:</b> ${book.author}</p>
                            <p><b>Price:</b> ₹${book.price}</p>
                            <div class="book-actions">
                                <button class="edit-btn" onclick="showEditForm(${book.id}, '${escapeQuotes(book.title)}', '${escapeQuotes(book.author)}', ${book.price})">
                                    ✏️ Edit
                                </button>
                                <button class="delete-btn" onclick="deleteBook(${book.id})">
                                    🗑️ Delete
                                </button>
                            </div>
                            <div id="edit-form-${book.id}" style="display:none;" class="edit-form">
                                <b>Edit Book</b><br><br>
                                <input type="text" id="edit-title-${book.id}" placeholder="New Title">
                                <input type="text" id="edit-author-${book.id}" placeholder="New Author">
                                <input type="number" id="edit-price-${book.id}" placeholder="New Price" min="1">
                                <br>
                                <button class="update-btn" onclick="updateBook(${book.id})">✔ Save</button>
                                <button class="cancel-btn" onclick="hideEditForm(${book.id})">✖ Cancel</button>
                            </div>
                        </div>
                    `;
                });

                list.innerHTML = output;
            })
            .catch(() => {
                document.getElementById("bookList").innerHTML =
                    "<p style='color:red;'>❌ Could not connect to backend. Make sure Spring Boot is running on port 9093.</p>";
            });
        }

        function escapeQuotes(str) {
            return str.replace(/'/g, "\\'").replace(/"/g, '\\"');
        }

        // SHOW / HIDE EDIT FORM
        function showEditForm(id, title, author, price) {
            document.getElementById(`edit-title-${id}`).value = title;
            document.getElementById(`edit-author-${id}`).value = author;
            document.getElementById(`edit-price-${id}`).value = price;
            document.getElementById(`edit-form-${id}`).style.display = "block";
        }

        function hideEditForm(id) {
            document.getElementById(`edit-form-${id}`).style.display = "none";
        }

        // ADD BOOK
        function addBook() {
            const title  = document.getElementById("title").value.trim();
            const author = document.getElementById("author").value.trim();
            const price  = document.getElementById("price").value;

            if (!title || !author || !price) {
                showMessage("⚠️ Please fill all fields!", "error");
                return;
            }

            fetch(`${API}/books`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ title, author, price: parseFloat(price) })
            })
            .then(res => res.json())
            .then(() => {
                showMessage("✅ Book Added Successfully!", "success");
                document.getElementById("title").value  = "";
                document.getElementById("author").value = "";
                document.getElementById("price").value  = "";
                loadBooks();
            })
            .catch(() => showMessage("❌ Failed to add book.", "error"));
        }

        // UPDATE BOOK
        function updateBook(id) {
            const title  = document.getElementById(`edit-title-${id}`).value.trim();
            const author = document.getElementById(`edit-author-${id}`).value.trim();
            const price  = document.getElementById(`edit-price-${id}`).value;

            if (!title || !author || !price) {
                showMessage("⚠️ Please fill all edit fields!", "error");
                return;
            }

            fetch(`${API}/books/${id}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ title, author, price: parseFloat(price) })
            })
            .then(res => res.json())
            .then(() => {
                showMessage("✅ Book Updated Successfully!", "success");
                loadBooks();
            })
            .catch(() => showMessage("❌ Failed to update book.", "error"));
        }

        // DELETE BOOK
        function deleteBook(id) {
            if (!confirm("Are you sure you want to delete this book?")) return;

            fetch(`${API}/books/${id}`, { method: "DELETE" })
            .then(() => {
                showMessage("✅ Book Deleted Successfully!", "success");
                loadBooks();
            })
            .catch(() => showMessage("❌ Failed to delete book.", "error"));
        }

        // Load on page open
        loadBooks();
    </script>
</body>

</html>
